name: Offline correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python scripts/benchmark.py > benchmark-ci.json
      - name: Check replay invariants
        run: python -c "import json; d=json.load(open('benchmark-ci.json')); assert d['matching_replay_checksums']==50; assert d['ingest']['quarantined']==0"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-python-${{ matrix.python }}
          path: benchmark-ci.json
