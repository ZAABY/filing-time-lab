[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-time-lab"
version = "0.1.0"
description = "Replayable SEC fact-version ETL with explicit historical-query limits"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.4,<3"]

[project.scripts]
filing-time = "filing_time_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
